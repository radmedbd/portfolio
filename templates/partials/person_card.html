<article class="person-card">{% if person.photo %}<img src="{{ person.photo.url }}" alt="Portrait of {{ person.name }}">{% else %}<div class="person-placeholder" aria-hidden="true">{{ person.name|first }}</div>{% endif %}<div><span class="badge">{{ person.relationship_type }}</span><h3><a href="{% url 'people_detail' person.slug %}">{{ person.name }}{% if person.degrees %}, {{ person.degrees }}{% endif %}</a></h3><p>{{ person.title }}</p><small>{{ person.institution }}{% if person.country %}, {{ person.country }}{% endif %}</small></div></article>
